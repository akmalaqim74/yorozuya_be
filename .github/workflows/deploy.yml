name: Deploy backend to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/yorozuya_be
            git fetch origin main
            git reset --hard origin/main

            TAG=$(git rev-parse --short HEAD)
            sudo docker build -t yorozuya_be:$TAG .

            # Start the new container on a temporary port, wait for it to
            # report healthy, only then cut traffic over -- if the new image
            # is broken, the old container just keeps serving.
            sudo docker run -d --name yorozuya_be_new --env-file .env -p 3001:3000 yorozuya_be:$TAG

            HEALTHY=0
            for i in $(seq 1 15); do
              if curl -sf http://localhost:3001/health-check > /dev/null; then
                HEALTHY=1
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" != "1" ]; then
              echo "New container failed health check, rolling back."
              sudo docker logs yorozuya_be_new --tail 50 || true
              sudo docker stop yorozuya_be_new || true
              sudo docker rm yorozuya_be_new || true
              exit 1
            fi

            sudo docker stop yorozuya_be_new
            sudo docker rm yorozuya_be_new

            sudo docker stop yorozuya_be || true
            sudo docker rm yorozuya_be || true
            sudo docker run -d --name yorozuya_be --restart unless-stopped --env-file .env -p 3000:3000 yorozuya_be:$TAG

            # Drop old images, keep the current + previous couple for quick rollback.
            sudo docker image prune -f
